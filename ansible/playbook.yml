---
- name: Doodle-Dash Deployment & Health Verification
  hosts: aws
  gather_facts: false

  tasks:
    - name: 1. Pull latest code from GitHub
      command: git pull
      args:
        chdir: /home/ubuntu/letsdraw

    - name: 2. Rebuild and start containers with Docker Compose
      command: docker compose up -d --build
      args:
        chdir: /home/ubuntu/letsdraw

    - name: 3. Verify Backend /health endpoint is UP
      uri:
        url: "http://localhost:5000/health"
        status_code: 200
        return_content: true
      register: health
      until: health.status == 200 and 'UP' in health.content
      retries: 5
      delay: 3

    - name: 3. Verify Frontend website is responding
      uri:
        url: "http://localhost:3001"
        status_code: 200

    - name: 4. Display Success Message
      debug:
        msg:
          - "========================================"
          - "🎉 DOODLE-DASH IS UP AND RUNNING! 🎉"
          - "Game Frontend:  http://{{ ansible_host }}:3001"
          - "Backend Health: http://{{ ansible_host }}:5000/health"
          - "Nagios Monitor: http://{{ ansible_host }}:8085/nagios/"
          - "========================================"
