# ==========================================
# 1. HOST DEFINITIONS
# ==========================================

# Backend container
define host {
    use                 generic-host
    host_name           backend
    alias               Backend Server
    address             backend
    max_check_attempts  3
    check_period        24x7
    notification_period 24x7
}

# Frontend container
define host {
    use                 generic-host
    host_name           frontend
    alias               Frontend Server
    address             frontend
    max_check_attempts  3
    check_period        24x7
    notification_period 24x7
}

# ==========================================
# 2. SERVICE HEALTH CHECKS
# ==========================================

# Check Backend Health Endpoint (http://backend:5000/health)
define service {
    use                 generic-service
    host_name           backend
    service_description Backend Health Check
    check_command       check_http!-p 5000 -u /health
    max_check_attempts  3
    check_interval      1
    retry_interval      1
    check_period        24x7
    notification_period 24x7
}

# Check Frontend Web Server (http://frontend:80)
define service {
    use                 generic-service
    host_name           frontend
    service_description Frontend Website Check
    check_command       check_http!-p 80
    max_check_attempts  3
    check_interval      1
    retry_interval      1
    check_period        24x7
    notification_period 24x7
}
